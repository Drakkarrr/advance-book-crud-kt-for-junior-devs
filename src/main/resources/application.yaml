spring:
  application:
    name: drakkar
  datasource:
    url: jdbc:postgresql://localhost:5432/book_practice
    username: root
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080